<div class="movie-card" style="background:{{gradient}}">
    <div class="movie-card-title card-title">{{title}}</div>
    <div class="movie-card-meta">{{genre}} · {{year}}</div>
    <div class="movie-card-overlay">
        <span class="badge nf-rating">{{ratingLabel}} {{rating}}</span>
        <button class="btn watch-btn" data-movie='{{movie}}'>{{watchBtn}}</button>
    </div>
</div>
